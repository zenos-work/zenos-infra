name: Backend CI/Deploy (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "staging or production"
      run_deploy:
        required: false
        type: boolean
        default: false
        description: "Whether to run deployment job"
      min_coverage:
        required: false
        type: string
        default: "80"
        description: "Minimum required backend line coverage percentage"

permissions:
  contents: write

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Lint backend
        run: uv run ruff check src tests

      - name: Run backend tests with coverage
        run: |
          uv run --with pytest-cov pytest -q \
            --cov=src \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json

      - name: Parse coverage metrics
        id: coverage_metrics
        run: |
          cat > /tmp/parse_backend_coverage.py <<'PY'
          import json
          import os

          with open("coverage.json", "r", encoding="utf-8") as f:
            data = json.load(f)

          totals = data.get("totals", {})
          line_pct = float(totals.get("percent_covered", 0.0))
          branches = int(totals.get("num_branches", 0) or 0)
          covered_branches = int(totals.get("covered_branches", 0) or 0)
          branch_pct = (covered_branches / branches * 100.0) if branches > 0 else 0.0

          output_file = os.environ.get("GITHUB_OUTPUT")
          if not output_file:
            raise RuntimeError("GITHUB_OUTPUT is not set")

          with open(output_file, "a", encoding="utf-8") as out:
            out.write(f"line_pct={line_pct:.2f}\n")
            out.write(f"branch_pct={branch_pct:.2f}\n")
            out.write(f"num_branches={branches}\n")
          PY
          python /tmp/parse_backend_coverage.py

      - name: Enforce minimum backend coverage
        run: |
          ACTUAL="${{ steps.coverage_metrics.outputs.line_pct }}"
          REQUIRED="${{ inputs.min_coverage }}"

          if [ -z "$ACTUAL" ]; then
            echo "Coverage parse failed: line_pct output is empty"
            exit 1
          fi

          echo "Backend line coverage: ${ACTUAL}%"
          echo "Required minimum: ${REQUIRED}%"

          awk -v actual="$ACTUAL" -v required="$REQUIRED" 'BEGIN { exit(actual + 0 >= required + 0 ? 0 : 1) }'

      - name: Publish backend coverage summary
        run: |
          {
            echo "## Backend Coverage";
            echo "| Metric | Value |";
            echo "|---|---:|";
            echo "| Line coverage | ${{ steps.coverage_metrics.outputs.line_pct }}% |";
            echo "| Branch coverage | ${{ steps.coverage_metrics.outputs.branch_pct }}% |";
            echo "| Required minimum | ${{ inputs.min_coverage }}% |";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            coverage.json

      - name: Security scan (Bandit)
        run: |
          uv run --with bandit bandit -r src -f json -o bandit-report.json --exit-zero

      - name: Security scan (pip-audit)
        run: |
          uv run --with pip-audit pip-audit --format json --output pip-audit-report.json || true

      - name: Upload backend security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

      - name: Publish backend security summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_file:
            raise RuntimeError("GITHUB_STEP_SUMMARY is not set")

          summary_path = Path(summary_file)

          bandit_path = Path("bandit-report.json")
          pip_audit_path = Path("pip-audit-report.json")

          lines = []
          lines.append("## Backend Vulnerability Report")
          lines.append("")

          # Bandit summary
          if bandit_path.exists():
            try:
              bandit = json.loads(bandit_path.read_text(encoding="utf-8"))
              bandit_results = bandit.get("results", []) or []
              severity_counts = Counter(
                (item.get("issue_severity") or "UNKNOWN").upper()
                for item in bandit_results
              )

              lines.append("### Bandit (SAST)")
              lines.append("| Metric | Value |")
              lines.append("|---|---:|")
              lines.append(f"| Total findings | {len(bandit_results)} |")
              lines.append(f"| High | {severity_counts.get('HIGH', 0)} |")
              lines.append(f"| Medium | {severity_counts.get('MEDIUM', 0)} |")
              lines.append(f"| Low | {severity_counts.get('LOW', 0)} |")
              lines.append(f"| Unknown | {severity_counts.get('UNKNOWN', 0)} |")

              if bandit_results:
                lines.append("")
                lines.append("Top findings:")
                lines.append("| Severity | Rule | Location |")
                lines.append("|---|---|---|")
                for item in bandit_results[:10]:
                  sev = (item.get("issue_severity") or "UNKNOWN").upper()
                  rule = item.get("test_id") or "N/A"
                  filename = item.get("filename") or "N/A"
                  line_no = item.get("line_number") or "?"
                  lines.append(f"| {sev} | {rule} | {filename}:{line_no} |")
            except Exception as exc:
              lines.append("### Bandit (SAST)")
              lines.append(f"Could not parse Bandit report: {exc}")
          else:
            lines.append("### Bandit (SAST)")
            lines.append("Bandit report missing")

          lines.append("")

          # pip-audit summary
          if pip_audit_path.exists():
            try:
              pip_audit = json.loads(pip_audit_path.read_text(encoding="utf-8"))
              deps = pip_audit.get("dependencies", []) or []
              vuln_count = 0
              affected_deps = []

              for dep in deps:
                vulns = dep.get("vulns", []) or []
                if vulns:
                  vuln_count += len(vulns)
                  affected_deps.append((dep.get("name") or "unknown", len(vulns)))

              lines.append("### pip-audit (Dependencies)")
              lines.append("| Metric | Value |")
              lines.append("|---|---:|")
              lines.append(f"| Total vulnerabilities | {vuln_count} |")
              lines.append(f"| Affected packages | {len(affected_deps)} |")
              lines.append("| Severity data | Not provided by pip-audit JSON |")

              if affected_deps:
                lines.append("")
                lines.append("Most affected packages:")
                lines.append("| Package | Vulnerabilities |")
                lines.append("|---|---:|")
                for name, count in sorted(affected_deps, key=lambda x: x[1], reverse=True)[:10]:
                  lines.append(f"| {name} | {count} |")
            except Exception as exc:
              lines.append("### pip-audit (Dependencies)")
              lines.append(f"Could not parse pip-audit report: {exc}")
          else:
            lines.append("### pip-audit (Dependencies)")
            lines.append("pip-audit report missing")

          with summary_path.open("a", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")
          PY

  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    if: inputs.run_deploy
    environment: ${{ inputs.environment }}
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Deploy backend to Cloudflare Worker
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            npx wrangler deploy --config wrangler.jsonc --env staging
          else
            npx wrangler deploy --config wrangler.jsonc
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    name: Create Production Release Tag
    runs-on: ubuntu-latest
    needs: deploy
    if: inputs.run_deploy && inputs.environment == 'production'

    steps:
      - name: Generate release tag
        id: tag
        run: |
          echo "tag_name=prod-v$(date +%Y.%m.%d)-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          name: Production Release ${{ steps.tag.outputs.tag_name }}
          body: |
            Automated production release after successful staging -> master promotion.

            Deployment environment: production
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
