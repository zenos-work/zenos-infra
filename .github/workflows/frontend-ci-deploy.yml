name: Frontend CI/Deploy (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "staging or production"
      run_deploy:
        required: false
        type: boolean
        default: false
        description: "Whether to run deployment job"
      min_coverage:
        required: false
        type: string
        default: "80"
        description: "Minimum required frontend line coverage percentage"

permissions:
  contents: write

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Run frontend tests with coverage
        run: pnpm exec vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text --coverage.reporter=lcov

      - name: Parse frontend coverage metrics
        id: coverage_metrics
        run: |
          node -e '
          const fs = require("fs");
          const outputFile = process.env.GITHUB_OUTPUT;
          const coverageFile = "coverage/coverage-summary.json";

          if (!outputFile) {
            throw new Error("GITHUB_OUTPUT is not set");
          }

          if (!fs.existsSync(coverageFile)) {
            throw new Error(`Coverage summary not found at ${coverageFile}`);
          }

          const data = JSON.parse(fs.readFileSync(coverageFile, "utf8"));
          const linePct = data.total.lines.pct || 0;
          const branchPct = data.total.branches.pct || 0;
          fs.appendFileSync(outputFile, `line_pct=${linePct.toFixed(2)}\n`);
          fs.appendFileSync(outputFile, `branch_pct=${branchPct.toFixed(2)}\n`);
          '

      - name: Enforce minimum frontend coverage
        run: |
          ACTUAL="${{ steps.coverage_metrics.outputs.line_pct }}"
          REQUIRED="${{ inputs.min_coverage }}"

          if [ -z "$ACTUAL" ]; then
            echo "Coverage parse failed: line_pct output is empty"
            exit 1
          fi

          echo "Frontend line coverage: ${ACTUAL}%"
          echo "Required minimum: ${REQUIRED}%"

          awk -v actual="$ACTUAL" -v required="$REQUIRED" 'BEGIN { exit(actual + 0 >= required + 0 ? 0 : 1) }'

      - name: Publish frontend coverage summary
        run: |
          {
            echo "## Frontend Coverage";
            echo "| Metric | Value |";
            echo "|---|---:|";
            echo "| Line coverage | ${{ steps.coverage_metrics.outputs.line_pct }}% |";
            echo "| Branch coverage | ${{ steps.coverage_metrics.outputs.branch_pct }}% |";
            echo "| Required minimum | ${{ inputs.min_coverage }}% |";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info

      - name: Security scan (pnpm audit)
        id: pnpm_audit
        continue-on-error: true
        run: |
          set +e
          pnpm audit --json > pnpm-audit-report.json
          audit_exit=$?
          printf '%s' "$audit_exit" > .pnpm-audit-exit-code
          echo "exit_code=${audit_exit}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload frontend security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-report
          path: pnpm-audit-report.json

      - name: Publish frontend security summary
        if: always()
        run: |
          node -e '
          const fs = require("fs");

          const summaryFile = process.env.GITHUB_STEP_SUMMARY;
          if (!summaryFile) {
            throw new Error("GITHUB_STEP_SUMMARY is not set");
          }

          const reportFile = "pnpm-audit-report.json";
          const lines = [];
          lines.push("## Frontend Vulnerability Report");
          lines.push("");

          if (!fs.existsSync(reportFile)) {
            lines.push("pnpm audit report missing");
          } else {
            try {
              const data = JSON.parse(fs.readFileSync(reportFile, "utf8"));
              const vulnMeta =
                data?.metadata?.vulnerabilities ||
                data?.vulnerabilities ||
                {};

              const info = Number(vulnMeta.info || 0);
              const low = Number(vulnMeta.low || 0);
              const moderate = Number(vulnMeta.moderate || 0);
              const high = Number(vulnMeta.high || 0);
              const critical = Number(vulnMeta.critical || 0);
              const total = Number(vulnMeta.total || info + low + moderate + high + critical);

              lines.push("| Severity | Count |");
              lines.push("|---|---:|");
              lines.push(`| Critical | ${critical} |`);
              lines.push(`| High | ${high} |`);
              lines.push(`| Moderate | ${moderate} |`);
              lines.push(`| Low | ${low} |`);
              lines.push(`| Info | ${info} |`);
              lines.push(`| Total | ${total} |`);

              const advisories = data?.advisories || {};
              const advisoryList = Object.values(advisories);

              if (advisoryList.length > 0) {
                lines.push("");
                lines.push("Top advisories:");
                lines.push("| Severity | Package | Title | URL |");
                lines.push("|---|---|---|---|");

                const rank = { critical: 5, high: 4, moderate: 3, low: 2, info: 1 };
                advisoryList
                  .sort((a, b) => (rank[(b.severity || "").toLowerCase()] || 0) - (rank[(a.severity || "").toLowerCase()] || 0))
                  .slice(0, 10)
                  .forEach((adv) => {
                    const sev = adv.severity || "unknown";
                    const pkg = adv.module_name || adv.name || "unknown";
                    const title = (adv.title || "").replace(/\|/g, "\\|");
                    const url = adv.url || "";
                    lines.push(`| ${sev} | ${pkg} | ${title} | ${url} |`);
                  });
              }
            } catch (err) {
              lines.push(`Could not parse pnpm audit report: ${err.message}`);
            }
          }

          fs.appendFileSync(summaryFile, lines.join("\n") + "\n");
          '

      - name: Enforce pnpm audit result
        if: always()
        run: |
          exit_code="${{ steps.pnpm_audit.outputs.exit_code }}"

          if [ -z "$exit_code" ] && [ -f .pnpm-audit-exit-code ]; then
            exit_code="$(cat .pnpm-audit-exit-code)"
          fi

          if [ -z "$exit_code" ]; then
            echo "pnpm audit exit code missing; failing to avoid false green"
            exit 1
          fi

          if [ "$exit_code" -ne 0 ]; then
            echo "pnpm audit detected vulnerabilities (exit code: $exit_code)"
            exit "$exit_code"
          fi

      - name: Build frontend
        run: pnpm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist

  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    if: inputs.run_deploy
    environment: ${{ inputs.environment }}
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy frontend to Cloudflare Pages
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            npx --yes wrangler@4 pages deploy dist --project-name zenos-frontend-staging --branch staging
          else
            npx --yes wrangler@4 pages deploy dist --project-name zenos-frontend --branch master
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    name: Create Production Release Tag
    runs-on: ubuntu-latest
    needs: deploy
    if: inputs.run_deploy && inputs.environment == 'production'

    steps:
      - name: Generate release tag
        id: tag
        run: |
          echo "tag_name=prod-v$(date +%Y.%m.%d)-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          name: Production Release ${{ steps.tag.outputs.tag_name }}
          body: |
            Automated production release after successful staging -> master promotion.

            Deployment environment: production
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
